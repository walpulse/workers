name: token-taxonomy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Re-ingest even if CG + DefiLlama fingerprint unchanged
        type: boolean
        default: false
  schedule:
    # Daily 12:00 UTC — no-op if source_hash unchanged
    - cron: "0 12 * * *"

permissions:
  contents: read

concurrency:
  group: token-taxonomy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Sync token taxonomy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          python -m workers.token_taxonomy.job $ARGS
