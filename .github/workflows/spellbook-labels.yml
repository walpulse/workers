name: spellbook-labels

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Re-ingest even if Spellbook fingerprint unchanged
        type: boolean
        default: false
  schedule:
    # Daily 11:00 UTC — no-op if labels+cex path fingerprint unchanged
    - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: spellbook-labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Sync Spellbook static labels
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          python -m workers.spellbook_labels.job $ARGS
