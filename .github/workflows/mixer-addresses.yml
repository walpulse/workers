name: mixer-addresses

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Re-ingest even if composite source hash unchanged
        type: boolean
        default: false
  schedule:
    # Daily 08:00 UTC — after cex (06:00) and ofac (07:00)
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: mixer-addresses
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Sync mixer addresses
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          python -m workers.mixer_addresses.job $ARGS
