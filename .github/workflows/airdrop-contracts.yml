name: airdrop-contracts

# Discovery: Sablier Envio GraphQL (no Alchemy eth_getLogs). Weekly cron + path-filtered push.
on:
  push:
    branches: [main]
    paths:
      - "workers/airdrop_contracts/**"
      - ".github/workflows/airdrop-contracts.yml"
      - "tests/test_airdrop_contracts.py"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      force:
        description: Re-ingest even if source hash unchanged
        type: boolean
        default: false
      skip_factories:
        description: Skip Envio factory discovery (curated + existing clones only)
        type: boolean
        default: false
  schedule:
    # Weekly Monday 10:00 UTC
    - cron: "0 10 * * 1"

permissions:
  contents: read

concurrency:
  group: airdrop-contracts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/test_airdrop_contracts.py -q

      - name: Sync airdrop contracts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_factories }}" = "true" ]; then
            ARGS="$ARGS --skip-factories"
          fi
          python -m workers.airdrop_contracts.job $ARGS
