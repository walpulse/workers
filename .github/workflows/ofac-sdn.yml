name: ofac-sdn

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Re-ingest even if SDN Advanced ZIP hash unchanged
        type: boolean
        default: false
  schedule:
    # Daily 07:00 UTC — no-op if ZIP SHA-256 unchanged
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: ofac-sdn
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Sync OFAC SDN digital currency addresses
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          python -m workers.ofac_sdn.job $ARGS
