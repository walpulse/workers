name: analisis-pdf

on:
  push:
    branches: [main]
    paths:
      - "workers/analisis_pdf/**"
      - ".github/workflows/analisis-pdf.yml"
      - "requirements.txt"
      - "tests/test_analisis_pdf.py"
  workflow_dispatch:
    inputs:
      limit:
        description: Max pending rows to process
        type: number
        default: 20
  schedule:
    # Every 10 minutes UTC
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: analisis-pdf
  cancel-in-progress: false

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install WeasyPrint system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q tests/test_analisis_pdf.py

      - name: Generate and pin PDFs
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_API_KEY: ${{ secrets.PINATA_API_KEY }}
          PINATA_API_SECRET: ${{ secrets.PINATA_API_SECRET }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ] || [ "$LIMIT" = "null" ]; then
            LIMIT=20
          fi
          python -m workers.analisis_pdf.job --limit "$LIMIT"
